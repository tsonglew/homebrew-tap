name: CI

on:
  pull_request:
    paths:
      - "Formula/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
    paths:
      - "Formula/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homebrew-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-bot:
    runs-on: macos-14
    steps:
      - name: Set up Homebrew
        id: setup-homebrew
        uses: Homebrew/actions/setup-homebrew@b35a29a0f83ee8b8ca07b219fc8db3d7bb88ab49
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Ruby gems
        uses: actions/cache@v4
        with:
          path: ${{ steps.setup-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.setup-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Prepare test environment
        run: brew test-bot --only-setup

      - name: Check tap syntax
        run: brew test-bot --only-tap-syntax

      - name: Build and test changed formulae
        if: github.event_name == 'pull_request'
        run: brew test-bot --only-formulae

      - name: Upload bottles
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: bottles
          path: "*.bottle.*"
          if-no-files-found: ignore
